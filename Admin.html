<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<style>
body{
background:#020617;
}
</style>

</head>

<body class="text-white p-8">

<h1 class="text-5xl font-bold mb-10">
Admin Dashboard
</h1>

<div class="grid grid-cols-3 gap-6 mb-10">

<div class="bg-slate-800 p-6 rounded-2xl">
<h2 class="text-gray-400">Users</h2>
<p id="usersCount" class="text-4xl font-bold">0</p>
</div>

<div class="bg-slate-800 p-6 rounded-2xl">
<h2 class="text-gray-400">Jobs</h2>
<p id="jobsCount" class="text-4xl font-bold">0</p>
</div>

<div class="bg-slate-800 p-6 rounded-2xl">
<h2 class="text-gray-400">Proposals</h2>
<p id="proposalsCount" class="text-4xl font-bold">0</p>
</div>

</div>

<h2 class="text-3xl font-bold mb-5">
Users
</h2>

<div id="usersContainer"></div>

<h2 class="text-3xl font-bold mt-10 mb-5">
Jobs
</h2>

<div id="jobsContainer"></div>

<h2 class="text-3xl font-bold mt-10 mb-5">
Proposals
</h2>

<div id="proposalsContainer"></div>

<button onclick="logout()"
class="fixed bottom-5 right-5 bg-red-600 px-6 py-3 rounded-xl">
Logout
</button>

<script>

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DATABASE_ID = "6a01723d0014a5c79b6f";

const USERS = "users";
const GIGS = "gigs";
const PROPOSALS = "proposals";

async function loadUsers(){

const res = await databases.listDocuments(
DATABASE_ID,
USERS
);

document.getElementById("usersCount").innerText =
res.documents.length;

document.getElementById("usersContainer").innerHTML =
res.documents.map(user=>`

<div class="bg-slate-800 p-5 rounded-2xl mb-4">

<h3 class="text-xl font-bold">
${user.name}
</h3>

<p>
${user.email}
</p>

<p class="text-green-400">
${user.role}
</p>

</div>

`).join("");

}

async function loadJobs(){

const res = await databases.listDocuments(
DATABASE_ID,
GIGS
);

document.getElementById("jobsCount").innerText =
res.documents.length;

document.getElementById("jobsContainer").innerHTML =
res.documents.map(job=>`

<div class="bg-slate-800 p-5 rounded-2xl mb-4">

<h3 class="text-xl font-bold">
${job.title}
</h3>

<p>
Budget: $${job.budget}
</p>

<p>
Status: ${job.status}
</p>

</div>

`).join("");

}

async function loadProposals(){

const res = await databases.listDocuments(
DATABASE_ID,
PROPOSALS
);

document.getElementById("proposalsCount").innerText =
res.documents.length;

document.getElementById("proposalsContainer").innerHTML =
res.documents.map(p=>`

<div class="bg-slate-800 p-5 rounded-2xl mb-4">

<p>
Price: $${p.price}
</p>

<p>
Status: ${p.status}
</p>

<button onclick="updateProposal('${p.$id}','accepted')"
class="bg-green-600 px-4 py-2 rounded-xl mt-3 mr-2">
Accept
</button>

<button onclick="updateProposal('${p.$id}','rejected')"
class="bg-red-600 px-4 py-2 rounded-xl mt-3">
Reject
</button>

</div>

`).join("");

}

async function updateProposal(id,status){

await databases.updateDocument(
DATABASE_ID,
PROPOSALS,
id,
{
status
}
);

loadProposals();

}

async function logout(){

await account.deleteSessions();

window.location.href = "index.html";

}

loadUsers();
loadJobs();
loadProposals();

</script>

</body>
</html>
