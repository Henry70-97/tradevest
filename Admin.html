<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | AI Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0/dist/umd/sdk.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-black p-4 flex justify-between">
        <h1 class="text-2xl font-bold">Admin Dashboard</h1>
        <button onclick="logout()" class="bg-red-600 px-4 py-1 rounded">Logout</button>
    </nav>
    <div class="container mx-auto p-6">
        <div class="grid md:grid-cols-3 gap-6">
            <!-- Left: Users & Chat Moderation -->
            <div class="bg-gray-800 p-4 rounded-xl">
                <h2 class="text-xl font-bold mb-3">Users & Moderation</h2>
                <div id="usersList" class="space-y-2 max-h-96 overflow-y-auto"></div>
                <button onclick="disableAllChats()" class="mt-4 bg-red-700 w-full py-2 rounded">Disable All Chats (Global)</button>
            </div>
            <!-- Middle: Certificates Management -->
            <div class="bg-gray-800 p-4 rounded-xl">
                <h2 class="text-xl font-bold mb-3">Certificates</h2>
                <button onclick="showCreateCertModal()" class="bg-green-600 px-4 py-1 rounded mb-2">+ Create New Certificate</button>
                <div id="certList" class="space-y-2 max-h-96 overflow-y-auto"></div>
                <hr class="my-3">
                <h3 class="font-semibold">Pending Applications</h3>
                <div id="pendingApps" class="space-y-2"></div>
                <button onclick="window.open('https://edgertix-creator.lovable.app', '_blank')" class="mt-4 bg-indigo-600 w-full py-2 rounded">Generate Certificate (External)</button>
            </div>
            <!-- Right: Projects Management -->
            <div class="bg-gray-800 p-4 rounded-xl">
                <h2 class="text-xl font-bold mb-3">Projects / Jobs</h2>
                <button onclick="showCreateJobModal()" class="bg-green-600 px-4 py-1 rounded mb-2">+ Create New Job</button>
                <div id="jobsList" class="space-y-2 max-h-96 overflow-y-auto"></div>
                <h3 class="font-semibold mt-4">Submitted Work Pending Review</h3>
                <div id="pendingProjects" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Modals (simplified) -->
    <div id="createCertModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-xl w-96">
            <h3 class="text-xl mb-3">New Certificate</h3>
            <input type="text" id="certTitle" placeholder="Title" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="text" id="certType" placeholder="Type (e.g., AI Developer)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="number" id="certValidity" placeholder="Validity (months)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="number" id="certCost" placeholder="Cost (USD)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="text" id="certImageUrl" placeholder="Certificate Image URL" class="w-full p-2 rounded bg-gray-700 mb-2">
            <button onclick="createCertificate()" class="bg-indigo-600 w-full py-2 rounded">Create</button>
            <button onclick="closeModal('createCertModal')" class="mt-2 text-gray-400">Cancel</button>
        </div>
    </div>

    <div id="createJobModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-xl w-96">
            <h3 class="text-xl mb-3">New Job</h3>
            <input type="text" id="jobTitle" placeholder="Title" class="w-full p-2 rounded bg-gray-700 mb-2">
            <textarea id="jobDesc" placeholder="Description" class="w-full p-2 rounded bg-gray-700 mb-2"></textarea>
            <input type="text" id="jobSkills" placeholder="Skills (comma separated)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="text" id="jobCertType" placeholder="Required certificate type (optional)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="number" id="jobBudget" placeholder="Budget (USD)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <input type="number" id="jobDeadline" placeholder="Deadline (days)" class="w-full p-2 rounded bg-gray-700 mb-2">
            <button onclick="createJob()" class="bg-indigo-600 w-full py-2 rounded">Create</button>
            <button onclick="closeModal('createJobModal')" class="mt-2 text-gray-400">Cancel</button>
        </div>
    </div>

    <script>
        const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
        const PROJECT_ID = '6a01720e0005a5f59bb9';
        const DATABASE_ID = '6a01723d0014a5c79b6f';
        const USERS_COLLECTION = 'users';
        const JOBS_COLLECTION = 'jobs';
        const PROJECTS_COLLECTION = 'projects';
        const CERTIFICATES_COLLECTION = 'certificates';
        const CERT_APPLICATIONS = 'cert_applications';
        const CHATS_COLLECTION = 'chats';
        const MESSAGES_COLLECTION = 'messages';

        const { Client, Account, Databases, ID, Query } = Appwrite;
        const client = new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
        const account = new Account(client);
        const databases = new Databases(client);

        let adminUser = null;

        async function loadAdmin() {
            try {
                const user = await account.get();
                if (user.email !== 'hankwane1@gmail.com') { alert('Unauthorized'); window.location.href = 'index.html'; }
                adminUser = user;
                loadAllUsers();
                loadAllCertificates();
                loadPendingApplications();
                loadAllJobs();
                loadPendingProjects();
            } catch(e) { window.location.href = 'index.html'; }
        }

        async function loadAllUsers() {
            const users = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION);
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            for (const u of users.documents) {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-700 p-2 rounded">
                        <div><img src="${u.profilePictureId ? 'https://via.placeholder.com/30' : ''}" class="w-6 h-6 rounded-full inline mr-2">${u.name} (${u.role})</div>
                        <button onclick="toggleSuspend('${u.$id}', ${!u.isChatSuspended})" class="bg-yellow-600 px-2 py-1 text-xs rounded">${u.isChatSuspended ? 'Unsuspend' : 'Suspend'}</button>
                    </div>
                `;
            }
        }
        window.toggleSuspend = async (userId, newState) => {
            await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, userId, { isChatSuspended: newState });
            loadAllUsers();
        };
        window.disableAllChats = async () => {
            // Set a global flag (e.g., create/update a settings doc)
            await databases.createDocument(DATABASE_ID, 'settings', 'global_chat_flag', { enabled: false });
            alert('All chats disabled. Users cannot send messages.');
        };

        // Certificates
        async function loadAllCertificates() {
            const certs = await databases.listDocuments(DATABASE_ID, CERTIFICATES_COLLECTION);
            const container = document.getElementById('certList');
            container.innerHTML = '';
            for (const c of certs.documents) {
                container.innerHTML += `<div class="bg-gray-700 p-2 rounded">${c.title} - $${c.cost} | Valid ${c.validityMonths} months</div>`;
            }
        }
        window.showCreateCertModal = () => document.getElementById('createCertModal').classList.add('flex');
        window.createCertificate = async () => {
            await databases.createDocument(DATABASE_ID, CERTIFICATES_COLLECTION, ID.unique(), {
                title: document.getElementById('certTitle').value,
                type: document.getElementById('certType').value,
                validityMonths: parseInt(document.getElementById('certValidity').value),
                cost: parseFloat(document.getElementById('certCost').value),
                imageUrl: document.getElementById('certImageUrl').value,
                isActive: true
            });
            closeModal('createCertModal');
            loadAllCertificates();
        };
        async function loadPendingApplications() {
            const apps = await databases.listDocuments(DATABASE_ID, CERT_APPLICATIONS, [Query.equal('status', 'pending')]);
            const container = document.getElementById('pendingApps');
            container.innerHTML = '';
            for (const app of apps.documents) {
                const cert = await databases.getDocument(DATABASE_ID, CERTIFICATES_COLLECTION, app.certificateId);
                container.innerHTML += `
                    <div class="bg-gray-700 p-2 rounded">
                        <p>${app.userDetails.name} applied for ${cert.title}</p>
                        <button onclick="approveCertificate('${app.$id}', '${cert.type}')" class="bg-green-600 text-xs px-2 py-1 rounded">Approve</button>
                        <button onclick="rejectCertificate('${app.$id}')" class="bg-red-600 text-xs px-2 py-1 rounded">Reject</button>
                    </div>
                `;
            }
        }
        window.approveCertificate = async (appId, certType) => {
            const certNumber = `CERT-${Date.now()}`;
            const expiryDate = new Date();
            expiryDate.setMonth(expiryDate.getMonth() + 3); // 3 months default
            await databases.updateDocument(DATABASE_ID, CERT_APPLICATIONS, appId, {
                status: 'approved',
                certificateNumber: certNumber,
                awardDate: new Date().toISOString(),
                expiryDate: expiryDate.toISOString(),
                downloadUrl: `https://example.com/certs/${certNumber}.pdf`,
                certificateType: certType
            });
            loadPendingApplications();
        };
        window.rejectCertificate = async (appId) => {
            await databases.updateDocument(DATABASE_ID, CERT_APPLICATIONS, appId, { status: 'rejected' });
            loadPendingApplications();
        };

        // Jobs Management
        async function loadAllJobs() {
            const jobs = await databases.listDocuments(DATABASE_ID, JOBS_COLLECTION);
            const container = document.getElementById('jobsList');
            container.innerHTML = '';
            for (const j of jobs.documents) {
                container.innerHTML += `<div class="bg-gray-700 p-2 rounded">${j.title} - $${j.budget} | ${j.status}</div>`;
            }
        }
        window.showCreateJobModal = () => document.getElementById('createJobModal').classList.add('flex');
        window.createJob = async () => {
            await databases.createDocument(DATABASE_ID, JOBS_COLLECTION, ID.unique(), {
                title: document.getElementById('jobTitle').value,
                description: document.getElementById('jobDesc').value,
                skillsRequired: document.getElementById('jobSkills').value.split(',').map(s=>s.trim()),
                certificateTypeRequired: document.getElementById('jobCertType').value,
                budget: parseFloat(document.getElementById('jobBudget').value),
                deadlineDays: parseInt(document.getElementById('jobDeadline').value),
                status: 'open',
                createdAt: new Date().toISOString()
            });
            closeModal('createJobModal');
            loadAllJobs();
        };
        async function loadPendingProjects() {
            const projects = await databases.listDocuments(DATABASE_ID, PROJECTS_COLLECTION, [Query.equal('status', 'pending_review')]);
            const container = document.getElementById('pendingProjects');
            container.innerHTML = '';
            for (const proj of projects.documents) {
                const job = await databases.getDocument(DATABASE_ID, JOBS_COLLECTION, proj.jobId);
                container.innerHTML += `
                    <div class="bg-gray-700 p-2 rounded">
                        <p>Project: ${job.title} | Work: <a href="${proj.submittedWork}" target="_blank" class="text-blue-400">View</a></p>
                        <button onclick="reviewProject('${proj.$id}', 'completed')" class="bg-green-600 text-xs px-2 py-1 rounded">Approve & Pay</button>
                        <button onclick="reviewProject('${proj.$id}', 'rejected')" class="bg-red-600 text-xs px-2 py-1 rounded">Reject</button>
                    </div>
                `;
            }
        }
        window.reviewProject = async (projectId, newStatus) => {
            const project = await databases.getDocument(DATABASE_ID, PROJECTS_COLLECTION, projectId);
            if (newStatus === 'completed') {
                // Add amount to freelancer wallet
                const freelancer = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION, [Query.equal('userId', project.freelancerId)]);
                if (freelancer.total > 0) {
                    const newBalance = freelancer.documents[0].walletBalance + project.amountAwarded;
                    await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, freelancer.documents[0].$id, { walletBalance: newBalance });
                }
            }
            await databases.updateDocument(DATABASE_ID, PROJECTS_COLLECTION, projectId, { status: newStatus });
            loadPendingProjects();
        };

        function closeModal(id) { document.getElementById(id).classList.remove('flex'); }
        window.logout = async () => { await account.deleteSession('current'); window.location.href = 'index.html'; };

        loadAdmin();
    </script>
</body>
</html>
