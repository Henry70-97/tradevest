<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexus AI Auth</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-gray-900 p-6 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold text-center mb-6">Nexus AI</h1>

    <input id="email" type="email" placeholder="Email"
        class="w-full p-3 mb-3 bg-gray-800 rounded"/>

    <input id="password" type="password" placeholder="Password"
        class="w-full p-3 mb-4 bg-gray-800 rounded"/>

    <button onclick="register()" 
        class="w-full bg-green-600 p-3 rounded mb-2">
        Register
    </button>

    <button onclick="login()" 
        class="w-full bg-blue-600 p-3 rounded">
        Login
    </button>

    <p id="msg" class="text-center mt-4 text-sm text-gray-400"></p>
</div>

<script>
// ---------------- APPWRITE CONFIG ----------------
const client = new Appwrite.Client()
    .setEndpoint("https://fra.cloud.appwrite.io/v1")
    .setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);

// ---------------- CHECK SESSION ON LOAD ----------------
async function checkSession() {
    try {
        await account.get();
        document.getElementById("msg").innerText = "Already logged in...";
        window.location.href = "user-dashboard.html";
    } catch (err) {
        console.log("No active session");
    }
}

checkSession();

// ---------------- REGISTER ----------------
async function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        // Create user
        await account.create("unique()", email, password);

        // Create session safely
        await account.createEmailPasswordSession(email, password);

        document.getElementById("msg").innerText = "Registration successful!";
        window.location.href = "user-dashboard.html";

    } catch (err) {
        document.getElementById("msg").innerText = err.message;
    }
}

// ---------------- LOGIN (FIXED SESSION ISSUE) ----------------
async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        // Prevent duplicate session error
        try {
            await account.get();
            window.location.href = "user-dashboard.html";
            return;
        } catch (e) {}

        await account.createEmailPasswordSession(email, password);

        document.getElementById("msg").innerText = "Login successful!";
        window.location.href = "user-dashboard.html";

    } catch (err) {
        document.getElementById("msg").innerText = err.message;
    }
}
</script>

</body>
</html>
