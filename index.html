<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus AI Marketplace</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<style>
body{
    background:#0f172a;
}
.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center text-white p-4">

<div class="glass w-full max-w-md rounded-3xl p-8 shadow-2xl border border-gray-700">

<h1 class="text-4xl font-bold text-center mb-2">
Nexus AI
</h1>

<p class="text-center text-gray-400 mb-8">
AI Freelancing Marketplace
</p>

<div class="space-y-4">

<input id="name"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700"
placeholder="Full Name">

<input id="email"
type="email"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700"
placeholder="Email Address">

<input id="password"
type="password"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700"
placeholder="Password">

<select id="role"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700">

<option value="user">Freelancer</option>
<option value="admin">Admin</option>

</select>

<button onclick="register()"
class="w-full bg-green-600 hover:bg-green-700 p-4 rounded-xl font-bold">
Create Account
</button>

<button onclick="login()"
class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold">
Login
</button>

</div>

<p id="msg" class="text-center mt-6 text-gray-300"></p>

</div>

<script>

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DATABASE_ID = "6a01723d0014a5c79b6f";

const USERS = "users";

async function register(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const role = document.getElementById("role").value;

const msg = document.getElementById("msg");

try{

msg.innerText = "Creating account...";

const user = await account.create(
Appwrite.ID.unique(),
email,
password,
name
);

await account.createEmailSession(email,password);

await databases.createDocument(
DATABASE_ID,
USERS,
Appwrite.ID.unique(),
{
userId:user.$id,
name,
email,
role,
wallet:0,
earnings:0,
createdAt:new Date().toISOString()
}
);

msg.innerText = "Registration successful";

setTimeout(()=>{
if(role === "admin"){
window.location.href = "admin.html";
}else{
window.location.href = "user-dashboard.html";
}
},1000);

}catch(err){
console.error(err);
msg.innerText = err.message;
}
}

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const msg = document.getElementById("msg");

try{

msg.innerText = "Logging in...";

await account.createEmailSession(email,password);

const user = await account.get();

const profile = await databases.listDocuments(
DATABASE_ID,
USERS,
[
Appwrite.Query.equal("userId",user.$id)
]
);

const role = profile.documents[0].role;

msg.innerText = "Success";

setTimeout(()=>{

if(role === "admin"){
window.location.href = "admin.html";
}else{
window.location.href = "user-dashboard.html";
}

},1000);

}catch(err){
console.error(err);
msg.innerText = err.message;
}
}

</script>

</body>
</html>
