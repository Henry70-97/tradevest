<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus AI - Registration</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

  <style>
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }

    .success { background: #16a34a; }
    .error { background: #dc2626; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-xl">

    <h1 class="text-2xl font-bold text-center mb-6">Nexus AI Registration</h1>

    <input id="name" type="text" placeholder="Full Name"
      class="w-full p-3 mb-3 rounded bg-gray-800 outline-none"/>

    <input id="email" type="email" placeholder="Email"
      class="w-full p-3 mb-3 rounded bg-gray-800 outline-none"/>

    <input id="password" type="password" placeholder="Password"
      class="w-full p-3 mb-4 rounded bg-gray-800 outline-none"/>

    <button onclick="registerUser()"
      class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold">
      Register
    </button>

    <p class="text-center text-sm mt-4 text-gray-400">
      Already registered?
      <a href="login.html" class="text-blue-400 hover:underline">
        Click here to login
      </a>
    </p>

  </div>

<script>
  const client = new Appwrite.Client();

  client
    .setEndpoint("https://fra.cloud.appwrite.io/v1")
    .setProject("6a01720e0005a5f59bb9");

  const account = new Appwrite.Account(client);

  const ADMIN_EMAIL = "hankwane1@gmail.com";

  function toast(message, type="success") {
    const div = document.createElement("div");
    div.className = `toast ${type}`;
    div.innerText = message;

    document.body.appendChild(div);

    setTimeout(() => {
      div.remove();
    }, 3500);
  }

  async function registerUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
      toast("All fields are required", "error");
      return;
    }

    try {
      // Create account
      await account.create(
        "unique()",
        email,
        password,
        name
      );

      // Login session
      await account.createEmailPasswordSession(email, password);

      // Send verification email
      await account.createVerification(
        window.location.href
      );

      toast("Verification email sent! Check your inbox.", "success");

      // Auto redirect after short delay
      setTimeout(async () => {
        const user = await account.get();

        if (user.email === ADMIN_EMAIL) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "user-dashboard.html";
        }
      }, 2500);

    } catch (err) {
      toast(err.message, "error");
    }
  }
</script>

</body>
</html>
