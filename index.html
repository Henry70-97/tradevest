<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus AI Auth</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

</head>

<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="bg-slate-900 p-6 rounded-2xl w-full max-w-md">

<h2 class="text-2xl font-bold mb-4 text-center">Nexus AI</h2>

<input id="name" placeholder="Full Name" class="w-full p-3 mb-2 bg-slate-800 rounded">
<input id="email" placeholder="Email" class="w-full p-3 mb-2 bg-slate-800 rounded">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-2 bg-slate-800 rounded">

<select id="role" class="w-full p-3 mb-4 bg-slate-800 rounded">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>

<button onclick="register()" class="w-full bg-green-600 p-3 mb-2 rounded">Register</button>
<button onclick="login()" class="w-full bg-blue-600 p-3 rounded">Login</button>

<p id="msg" class="text-sm text-gray-400 mt-3"></p>

</div>

<script>

/* ================= APPWRITE CONFIG ================= */

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB = "6a01723d0014a5c79b6f";
const USERS = "users";

/* ================= GET USER ================= */

async function getUser(){
try{
return await account.get();
}catch{
return null;
}
}

/* ================= AUTO REDIRECT ================= */

async function autoRedirect(){

const user = await getUser();
if(!user) return;

try{

const profile = await databases.listDocuments(
DB,
USERS,
[Appwrite.Query.equal("userId", user.$id)]
);

if(profile.documents.length > 0){

const role = profile.documents[0].role;

window.location.href =
role === "admin"
? "admin.html"
: "user-dashboard.html";

}

}catch(err){
console.error(err);
}

}

autoRedirect();

/* ================= REGISTER ================= */

async function register(){

const msg = document.getElementById("msg");

try{

msg.innerText = "Creating account...";

/* 1. CREATE ACCOUNT */
const newUser = await account.create(
Appwrite.ID.unique(),
email.value,
password.value,
name.value
);

/* 2. CREATE SESSION (CRITICAL FIX) */
await account.createEmailPasswordSession(
email.value,
password.value
);

/* 3. VERIFY SESSION */
const sessionUser = await account.get();

/* 4. SAVE PROFILE */
await databases.createDocument(
DB,
USERS,
Appwrite.ID.unique(),
{
userId: sessionUser.$id,
name: name.value,
email: email.value,
role: role.value
}
);

msg.innerText = "Success! Redirecting...";

/* 5. REDIRECT */
setTimeout(()=>{

window.location.href =
role.value === "admin"
? "admin.html"
: "user-dashboard.html";

},800);

}catch(err){

console.error(err);
msg.innerText = err.message;

}

}

/* ================= LOGIN ================= */

async function login(){

const msg = document.getElementById("msg");

try{

msg.innerText = "Logging in...";

/* CREATE SESSION */
await account.createEmailPasswordSession(
email.value,
password.value
);

/* GET USER */
const user = await account.get();

/* GET PROFILE */
const profile = await databases.listDocuments(
DB,
USERS,
[Appwrite.Query.equal("userId", user.$id)]
);

if(profile.documents.length === 0){
msg.innerText = "Profile not found";
return;
}

const role = profile.documents[0].role;

msg.innerText = "Success! Redirecting...";

setTimeout(()=>{

window.location.href =
role === "admin"
? "admin.html"
: "user-dashboard.html";

},800);

}catch(err){

console.error(err);
msg.innerText = err.message;

}

}

</script>

</body>
</html>
