<!DOCTYPE html>
<html>
<head>
<title>Nexus AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>

<body class="bg-slate-950 text-white flex justify-center items-center min-h-screen">

<div class="bg-slate-900 p-6 rounded-xl w-full max-w-md">

<h2 class="text-2xl mb-4">Nexus AI</h2>

<input id="name" placeholder="Name" class="w-full p-2 mb-2 bg-slate-800">
<input id="email" placeholder="Email" class="w-full p-2 mb-2 bg-slate-800">
<input id="password" type="password" placeholder="Password" class="w-full p-2 mb-2 bg-slate-800">

<select id="role" class="w-full p-2 mb-2 bg-slate-800">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>

<button onclick="register()" class="w-full bg-green-600 p-2 mb-2">Register</button>
<button onclick="login()" class="w-full bg-blue-600 p-2">Login</button>

<p id="msg" class="text-sm mt-3 text-gray-400"></p>

</div>

<script>

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DB = "6a01723d0014a5c79b6f";
const USERS = "users";

/* SESSION CHECK */
async function getUser(){
try{return await account.get();}catch{return null;}
}

/* REGISTER */
async function register(){

const user = await getUser();
if(user){
msg.innerText = "Already logged in";
return;
}

msg.innerText = "Creating...";

const newUser = await account.create(
Appwrite.ID.unique(),
email.value,
password.value,
name.value
);

await account.createEmailPasswordSession(email.value, password.value);

await databases.createDocument(DB, USERS, Appwrite.ID.unique(), {
userId: newUser.$id,
name: name.value,
email: email.value,
role: role.value
});

window.location.href =
role.value === "admin" ? "admin.html" : "user-dashboard.html";

}

/* LOGIN */
async function login(){

await account.createEmailPasswordSession(email.value, password.value);

const user = await account.get();

const profile = await databases.listDocuments(DB, USERS, [
Appwrite.Query.equal("userId", user.$id)
]);

if(profile.documents.length === 0){
msg.innerText = "No profile";
return;
}

const role = profile.documents[0].role;

window.location.href =
role === "admin" ? "admin.html" : "user-dashboard.html";

}

</script>

</body>
</html>
