<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus AI - Registration</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>

<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-xl">

    <h1 class="text-2xl font-bold text-center mb-6">Nexus AI Registration</h1>

    <div id="msg" class="text-sm text-center mb-4 text-red-400"></div>

    <input id="name" type="text" placeholder="Full Name"
      class="w-full p-3 mb-3 rounded bg-gray-800 outline-none"/>

    <input id="email" type="email" placeholder="Email"
      class="w-full p-3 mb-3 rounded bg-gray-800 outline-none"/>

    <input id="password" type="password" placeholder="Password"
      class="w-full p-3 mb-4 rounded bg-gray-800 outline-none"/>

    <button onclick="registerUser()"
      class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold">
      Register
    </button>

    <button onclick="checkVerification()"
      class="w-full mt-3 bg-green-600 hover:bg-green-700 p-3 rounded font-semibold">
      I have verified my email
    </button>

  </div>

<script>
  const client = new Appwrite.Client();

  client
    .setEndpoint("https://fra.cloud.appwrite.io/v1")
    .setProject("6a01720e0005a5f59bb9");

  const account = new Appwrite.Account(client);

  const ADMIN_EMAIL = "hankwane1@gmail.com";

  function showMsg(msg, color="red") {
    const el = document.getElementById("msg");
    el.style.color = color;
    el.innerText = msg;
  }

  async function registerUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
      showMsg("All fields are required");
      return;
    }

    try {
      // Create account
      await account.create(
        "unique()",
        email,
        password,
        name
      );

      // Create session (login)
      await account.createEmailPasswordSession(email, password);

      // Send verification email
      await account.createVerification(
        window.location.href
      );

      showMsg("Verification email sent. Check your inbox.", "green");

    } catch (err) {
      showMsg(err.message);
    }
  }

  async function checkVerification() {
    try {
      const user = await account.get();

      if (!user.emailVerification) {
        showMsg("Email not verified yet. Please verify first.");
        return;
      }

      // Role-based redirect
      if (user.email === ADMIN_EMAIL) {
        window.location.href = "admin.html";
      } else {
        window.location.href = "user-dashboard.html";
      }

    } catch (err) {
      showMsg("Please login first or verify email.");
    }
  }
</script>

</body>
</html>
