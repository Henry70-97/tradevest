<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus AI Marketplace</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<style>

body{
background:#020617;
font-family:Arial, sans-serif;
}

.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center text-white p-4">

<div class="glass w-full max-w-md rounded-3xl p-8 border border-slate-700 shadow-2xl">

<h1 class="text-4xl font-bold text-center mb-2">
Nexus AI
</h1>

<p class="text-center text-gray-400 mb-8">
AI Freelancing Marketplace
</p>

<div class="space-y-4">

<input
id="name"
type="text"
placeholder="Full Name"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
/>

<input
id="email"
type="email"
placeholder="Email Address"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
/>

<input
id="password"
type="password"
placeholder="Password"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
/>

<select
id="role"
class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
>

<option value="user">Freelancer</option>
<option value="admin">Admin</option>

</select>

<button
onclick="register()"
class="w-full bg-green-600 hover:bg-green-700 transition p-4 rounded-xl font-bold"
>
Create Account
</button>

<button
onclick="login()"
class="w-full bg-blue-600 hover:bg-blue-700 transition p-4 rounded-xl font-bold"
>
Login
</button>

</div>

<p id="msg" class="text-center mt-6 text-gray-300"></p>

</div>

<script>

/* =========================
APPWRITE CONFIG
========================= */

const client = new Appwrite.Client();

client
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DATABASE_ID = "6a01723d0014a5c79b6f";

/*
IMPORTANT:
REPLACE WITH YOUR REAL COLLECTION ID
*/

const USERS_COLLECTION = "users";

/* =========================
CHECK LOGGED IN USER
========================= */

async function getLoggedInUser(){

try{

const user = await account.get();

return user;

}catch(error){

return null;

}

}

/* =========================
AUTO REDIRECT
========================= */

async function checkSession(){

const currentUser = await getLoggedInUser();

if(!currentUser) return;

try{

const profile = await databases.listDocuments(
DATABASE_ID,
USERS_COLLECTION,
[
Appwrite.Query.equal("userId",currentUser.$id)
]
);

if(profile.documents.length > 0){

const role = profile.documents[0].role;

if(role === "admin"){

window.location.href = "admin.html";

}else{

window.location.href = "user-dashboard.html";

}

}

}catch(error){

console.error(error);

}

}

checkSession();

/* =========================
REGISTER
========================= */

async function register(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const role = document.getElementById("role").value;

const msg = document.getElementById("msg");

if(!name || !email || !password){

msg.innerText = "All fields are required";
return;

}

try{

msg.innerText = "Checking session...";

/* CHECK IF USER ALREADY LOGGED IN */

const existingUser = await getLoggedInUser();

if(existingUser){

msg.innerText = "Already logged in";

/* REDIRECT USER */

const profile = await databases.listDocuments(
DATABASE_ID,
USERS_COLLECTION,
[
Appwrite.Query.equal("userId",existingUser.$id)
]
);

if(profile.documents.length > 0){

const existingRole = profile.documents[0].role;

setTimeout(()=>{

if(existingRole === "admin"){

window.location.href = "admin.html";

}else{

window.location.href = "user-dashboard.html";

}

},500);

}

return;

}

/* CREATE ACCOUNT */

msg.innerText = "Creating account...";

const newUser = await account.create(
Appwrite.ID.unique(),
email,
password,
name
);

/* LOGIN USER */

await account.createEmailPasswordSession(
email,
password
);

/* CREATE USER PROFILE */

await databases.createDocument(
DATABASE_ID,
USERS_COLLECTION,
Appwrite.ID.unique(),
{
userId:newUser.$id,
name:name,
email:email,
role:role,
walletBalance:0,
totalEarnings:0,
activeJobs:0,
followers:0,
verified:false,
status:"active",
kycStatus:"pending",
createdAt:new Date().toISOString()
}
);

msg.innerText = "Registration successful";

/* REDIRECT */

setTimeout(()=>{

if(role === "admin"){

window.location.href = "admin.html";

}else{

window.location.href = "user-dashboard.html";

}

},1000);

}catch(error){

console.error(error);
msg.innerText = error.message;

}

}

/* =========================
LOGIN
========================= */

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

const msg = document.getElementById("msg");

if(!email || !password){

msg.innerText = "Email and password required";
return;

}

try{

/* CHECK EXISTING SESSION */

const existingUser = await getLoggedInUser();

if(existingUser){

msg.innerText = "Already logged in";

/* REDIRECT */

const profile = await databases.listDocuments(
DATABASE_ID,
USERS_COLLECTION,
[
Appwrite.Query.equal("userId",existingUser.$id)
]
);

if(profile.documents.length > 0){

const role = profile.documents[0].role;

setTimeout(()=>{

if(role === "admin"){

window.location.href = "admin.html";

}else{

window.location.href = "user-dashboard.html";

}

},500);

}

return;

}

/* LOGIN */

msg.innerText = "Logging in...";

await account.createEmailPasswordSession(
email,
password
);

const currentUser = await account.get();

/* GET PROFILE */

const profile = await databases.listDocuments(
DATABASE_ID,
USERS_COLLECTION,
[
Appwrite.Query.equal("userId",currentUser.$id)
]
);

if(profile.documents.length === 0){

msg.innerText = "Profile not found";
return;

}

const role = profile.documents[0].role;

msg.innerText = "Login successful";

/* REDIRECT */

setTimeout(()=>{

if(role === "admin"){

window.location.href = "admin.html";

}else{

window.location.href = "user-dashboard.html";

}

},1000);

}catch(error){

console.error(error);
msg.innerText = error.message;

}

}

</script>

</body>
</html>
