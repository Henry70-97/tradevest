<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus AI Auth</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

</head>

<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="bg-slate-900 p-8 rounded-2xl w-full max-w-md">

<h1 class="text-3xl font-bold mb-6 text-center">Nexus AI</h1>

<input id="name" placeholder="Name" class="w-full p-3 mb-3 bg-slate-800 rounded">
<input id="email" placeholder="Email" class="w-full p-3 mb-3 bg-slate-800 rounded">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-3 bg-slate-800 rounded">

<select id="role" class="w-full p-3 mb-4 bg-slate-800 rounded">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>

<button onclick="register()" class="w-full bg-green-600 p-3 rounded mb-2">Register</button>
<button onclick="login()" class="w-full bg-blue-600 p-3 rounded">Login</button>

<p id="msg" class="text-center mt-4 text-sm text-gray-400"></p>

</div>

<script>

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DATABASE_ID = "6a01723d0014a5c79b6f";
const USERS = "users";

/* ================= CHECK SESSION ================= */

async function getUser(){
try{
return await account.get();
}catch{
return null;
}
}

async function autoRedirect(){
const user = await getUser();
if(!user) return;

const profile = await databases.listDocuments(
DATABASE_ID,
USERS,
[Appwrite.Query.equal("userId", user.$id)]
);

if(profile.documents.length === 0) return;

const role = profile.documents[0].role;

window.location.href =
role === "admin" ? "admin.html" : "user-dashboard.html";
}

autoRedirect();

/* ================= REGISTER ================= */

async function register(){

const name = nameInput.value;
const email = emailInput.value;
const password = passwordInput.value;
const role = document.getElementById("role").value;

msg.innerText = "Creating account...";

try{

const newUser = await account.create(
Appwrite.ID.unique(),
email,
password,
name
);

await account.createEmailPasswordSession(email, password);

await databases.createDocument(
DATABASE_ID,
USERS,
Appwrite.ID.unique(),
{
userId: newUser.$id,
name,
email,
role
}
);

msg.innerText = "Success";

setTimeout(()=>{
window.location.href =
role === "admin" ? "admin.html" : "user-dashboard.html";
},800);

}catch(e){
msg.innerText = e.message;
}

}

/* ================= LOGIN ================= */

async function login(){

const email = emailInput.value;
const password = passwordInput.value;

msg.innerText = "Logging in...";

try{

await account.createEmailPasswordSession(email, password);

const user = await account.get();

const profile = await databases.listDocuments(
DATABASE_ID,
USERS,
[Appwrite.Query.equal("userId", user.$id)]
);

if(profile.documents.length === 0){
msg.innerText = "No profile found";
return;
}

const role = profile.documents[0].role;

window.location.href =
role === "admin" ? "admin.html" : "user-dashboard.html";

}catch(e){
msg.innerText = e.message;
}

}

</script>

</body>
</html>
