  <script>
// ----------------------------------------------
//  FIREBASE INTEGRATION (persistent balance & trades)
// ----------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDtGN7KCK0A4fhztLN0CgxsKkGROcO_-vI",
  authDomain: "bestpay-5b78c.firebaseapp.com",
  projectId: "bestpay-5b78c",
  storageBucket: "bestpay-5b78c.firebasestorage.app",
  messagingSenderId: "583230068716",
  appId: "1:583230068716:web:3e8d298b4d00b46c8652c9"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Global state
let balance = 10000;
let trades = [];
let activeTrade = null;      // { id, asset, direction, amount, expiry, entryPrice, timeLeft, endTime }
let tradeTimer = null;
let chartData = [];
let priceBase = 43250;
let currentView = 'dashboard';
let darkMode = true;
let currentUserId = null;
let tradesUnsubscribe = null;
let dataChangeCallback = null;    // stores onDataChanged from original flow

// Helper: show toast
function showToast(msg, type = 'info') {
    const colors = { success: 'bg-emerald-600', error: 'bg-red-600', warning: 'bg-amber-600', info: 'bg-gray-700' };
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${colors[type]} text-white text-sm px-4 py-2 rounded-lg shadow-lg`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// Update UI from trades array and balance
function updateStats() {
    const totalPnL = trades.reduce((s, t) => s + (t.profit || 0), 0);
    const wins = trades.filter(t => t.result === 'win').length;
    const winRate = trades.length > 0 ? ((wins / trades.length) * 100).toFixed(0) : 0;
    const pnlEl = document.getElementById('pnl-display');
    pnlEl.textContent = `${totalPnL >= 0 ? '+' : ''}$${totalPnL.toFixed(2)}`;
    pnlEl.className = `text-2xl font-bold font-mono ${totalPnL >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
    document.getElementById('winrate-display').textContent = `${winRate}%`;
    document.getElementById('balance-display').textContent = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
}

function renderHistory() {
    const container = document.getElementById('trade-history');
    if (!container) return;
    if (!trades.length) {
        container.innerHTML = '<p class="text-gray-600 text-sm text-center py-4">No trades yet. Place your first trade above!</p>';
        return;
    }
    const recent = [...trades].reverse().slice(0, 10);
    container.innerHTML = recent.map(t => `
        <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-gray-800/50 text-sm">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${t.result === 'win' ? 'bg-emerald-400' : 'bg-red-400'}"></span>
                <span class="font-mono">${t.asset}</span>
                <span class="text-xs text-gray-500 uppercase">${t.direction}</span>
            </div>
            <span class="font-mono ${t.result === 'win' ? 'text-emerald-400' : 'text-red-400'}">${t.profit >= 0 ? '+' : ''}$${(t.profit||0).toFixed(2)}</span>
        </div>
    `).join('');
}

function renderFullHistory() {
    const container = document.getElementById('full-history-list');
    if (!container) return;
    if (!trades.length) { container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No transactions</p>'; return; }
    container.innerHTML = [...trades].reverse().map(t => `
        <div class="flex items-center justify-between py-2 border-b border-gray-800 text-sm">
            <div><span class="font-mono">${t.asset}</span> <span class="text-xs text-gray-500">${t.direction?.toUpperCase()}</span></div>
            <div class="text-right"><span class="font-mono ${t.result==='win'?'text-emerald-400':'text-red-400'}">${t.profit>=0?'+':''}$${(t.profit||0).toFixed(2)}</span><p class="text-[10px] text-gray-600">${t.timestamp ? new Date(t.timestamp).toLocaleString() : ''}</p></div>
        </div>
    `).join('');
}

// Fetch trades & balance from Firestore and setup realtime listener
async function initFirebaseUser() {
    return new Promise((resolve) => {
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUserId = user.uid;
                // Ensure user document exists with initial balance 10000
                const userRef = db.collection("users").doc(currentUserId);
                const docSnap = await userRef.get();
                if (!docSnap.exists) {
                    await userRef.set({ balance: 10000, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    balance = 10000;
                } else {
                    balance = docSnap.data().balance || 10000;
                }
                updateBalanceDisplay();

                // Real-time listener on trades subcollection
                if (tradesUnsubscribe) tradesUnsubscribe();
                tradesUnsubscribe = db.collection("users").doc(currentUserId).collection("trades")
                    .orderBy("timestamp", "desc")
                    .onSnapshot((snapshot) => {
                        const newTrades = [];
                        snapshot.forEach(doc => {
                            newTrades.push({ id: doc.id, ...doc.data() });
                        });
                        trades = newTrades;
                        updateStats();
                        renderHistory();
                        if (dataChangeCallback) dataChangeCallback(trades);
                        // After loading trades, check for any pending trade that might be active but timer lost
                        checkPendingTradeOnLoad();
                    });
                resolve();
            } else {
                // Sign in anonymously
                try {
                    const cred = await auth.signInAnonymously();
                    currentUserId = cred.user.uid;
                    const userRef = db.collection("users").doc(currentUserId);
                    const docSnap = await userRef.get();
                    if (!docSnap.exists) {
                        await userRef.set({ balance: 10000 });
                        balance = 10000;
                    } else {
                        balance = docSnap.data().balance || 10000;
                    }
                    updateBalanceDisplay();
                    if (tradesUnsubscribe) tradesUnsubscribe();
                    tradesUnsubscribe = db.collection("users").doc(currentUserId).collection("trades")
                        .orderBy("timestamp", "desc")
                        .onSnapshot((snapshot) => {
                            const newTrades = [];
                            snapshot.forEach(doc => newTrades.push({ id: doc.id, ...doc.data() }));
                            trades = newTrades;
                            updateStats();
                            renderHistory();
                            if (dataChangeCallback) dataChangeCallback(trades);
                            checkPendingTradeOnLoad();
                        });
                    resolve();
                } catch(e) { console.error(e); showToast("Auth error", "error"); resolve(); }
            }
        });
    });
}

// Check if there's a pending (unresolved) trade in Firestore and resume timer
async function checkPendingTradeOnLoad() {
    if (activeTrade) return; // already active
    const pendingTrades = trades.filter(t => t.status === 'pending' && !t.resolved);
    if (pendingTrades.length === 0) return;
    // Take the most recent pending trade
    const pending = pendingTrades[0];
    const now = Date.now();
    const endTime = pending.endTime ? pending.endTime.toMillis?.() || pending.endTime : null;
    if (!endTime) return;
    const remainingSec = Math.floor((endTime - now) / 1000);
    if (remainingSec <= 0) {
        // Expired, resolve now
        await resolvePendingTradeWithFirestore(pending.id);
    } else {
        // Resume active trade
        activeTrade = {
            id: pending.id,
            asset: pending.asset,
            direction: pending.direction,
            amount: pending.amount,
            expiry: pending.expirySeconds,
            entryPrice: pending.entryPrice,
            timeLeft: remainingSec,
            endTime: endTime
        };
        const tradeEl = document.getElementById('active-trade');
        tradeEl.classList.remove('hidden');
        tradeEl.className = `mt-4 p-3 rounded-lg border animate-slide-up ${activeTrade.direction === 'up' ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-red-500/50 bg-red-500/10'}`;
        document.getElementById('active-trade-info').textContent = `${activeTrade.asset} ${activeTrade.direction.toUpperCase()} • $${activeTrade.amount}`;
        document.getElementById('active-trade-timer').textContent = `${activeTrade.timeLeft}s`;
        if (tradeTimer) clearInterval(tradeTimer);
        tradeTimer = setInterval(() => {
            if (!activeTrade) return;
            activeTrade.timeLeft--;
            document.getElementById('active-trade-timer').textContent = `${activeTrade.timeLeft}s`;
            if (activeTrade.timeLeft <= 0) {
                clearInterval(tradeTimer);
                resolveActiveTradeFromTimer();
            }
        }, 1000);
    }
}

async function resolvePendingTradeWithFirestore(tradeId) {
    const userRef = db.collection("users").doc(currentUserId);
    const tradeRef = db.collection("users").doc(currentUserId).collection("trades").doc(tradeId);
    const doc = await tradeRef.get();
    if (!doc.exists) return;
    const tradeData = doc.data();
    if (tradeData.resolved) return;
    const currentPrice = priceBase; // simulated price
    const priceChange = currentPrice - tradeData.entryPrice;
    const won = (tradeData.direction === 'up' && priceChange > 0) || (tradeData.direction === 'down' && priceChange < 0);
    const profitAmount = won ? tradeData.amount * 0.85 : -tradeData.amount;
    const balanceDelta = won ? (tradeData.amount + tradeData.amount * 0.85) : 0; // amount refund + profit
    // Update balance and trade record with transaction
    await db.runTransaction(async (transaction) => {
        const userSnap = await transaction.get(userRef);
        const currentBal = userSnap.data().balance || 10000;
        const newBalance = currentBal + (won ? tradeData.amount * 0.85 : -tradeData.amount);
        transaction.update(userRef, { balance: newBalance });
        transaction.update(tradeRef, {
            result: won ? 'win' : 'loss',
            profit: profitAmount,
            resolved: true,
            status: 'completed',
            resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
            closingPrice: currentPrice
        });
        balance = newBalance;
    });
    showToast(won ? `✅ Won +$${(tradeData.amount * 0.85).toFixed(2)}!` : `❌ Lost -$${tradeData.amount.toFixed(2)}`, won ? 'success' : 'error');
    if (activeTrade && activeTrade.id === tradeId) {
        if (tradeTimer) clearInterval(tradeTimer);
        document.getElementById('active-trade').classList.add('hidden');
        activeTrade = null;
    }
    updateBalanceDisplay();
}

async function resolveActiveTradeFromTimer() {
    if (!activeTrade) return;
    const tradeId = activeTrade.id;
    const userRef = db.collection("users").doc(currentUserId);
    const tradeRef = db.collection("users").doc(currentUserId).collection("trades").doc(tradeId);
    const doc = await tradeRef.get();
    if (!doc.exists) return;
    const tradeData = doc.data();
    if (tradeData.resolved) {
        cleanActiveTradeUI();
        return;
    }
    const currentPrice = priceBase;
    const priceChange = currentPrice - tradeData.entryPrice;
    const won = (tradeData.direction === 'up' && priceChange > 0) || (tradeData.direction === 'down' && priceChange < 0);
    const profitAmount = won ? tradeData.amount * 0.85 : -tradeData.amount;
    await db.runTransaction(async (transaction) => {
        const userSnap = await transaction.get(userRef);
        const currentBal = userSnap.data().balance;
        const newBalance = currentBal + (won ? tradeData.amount * 0.85 : -tradeData.amount);
        transaction.update(userRef, { balance: newBalance });
        transaction.update(tradeRef, {
            result: won ? 'win' : 'loss',
            profit: profitAmount,
            resolved: true,
            status: 'completed',
            resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
            closingPrice: currentPrice
        });
        balance = newBalance;
    });
    showToast(won ? `✨ Won +$${(tradeData.amount * 0.85).toFixed(2)}!` : `💔 Lost -$${tradeData.amount.toFixed(2)}`, won ? 'success' : 'error');
    cleanActiveTradeUI();
    updateBalanceDisplay();
}

function cleanActiveTradeUI() {
    if (tradeTimer) clearInterval(tradeTimer);
    document.getElementById('active-trade').classList.add('hidden');
    activeTrade = null;
}

// Override dataSdk to work with Firebase — compatibility with original code
window.dataSdk = {
    init: (handler) => {
        dataChangeCallback = handler.onDataChanged;
        // initial call with current trades (will be triggered after listener)
        if (trades.length) handler.onDataChanged(trades);
    },
    create: async (tradeRecord) => {
        // original create is called after resolveTrade; we already handle via transaction in resolver, but keep compatibility
        // fallback: if somehow called without existing pending trade, we create final trade doc.
        if (!currentUserId) return { isOk: false };
        const userRef = db.collection("users").doc(currentUserId);
        const tradeRef = userRef.collection("trades").doc();
        await tradeRef.set({
            ...tradeRecord,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'completed',
            resolved: true
        });
        await userRef.update({ balance: tradeRecord.balance_after });
        balance = tradeRecord.balance_after;
        updateBalanceDisplay();
        return { isOk: true };
    }
};

// Update local balance display
function updateBalanceDisplay() {
    const balEl = document.getElementById('balance-display');
    if (balEl) balEl.textContent = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
}

// ---------- TRADE PLACEMENT (now with Firestore transaction) ----------
async function placeTrade(direction) {
    if (activeTrade) { showToast('Trade already active! Wait for resolution.', 'warning'); return; }
    const amount = parseFloat(document.getElementById('trade-amount').value);
    if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
    if (amount > balance) { showToast('Insufficient balance', 'error'); return; }
    const asset = document.getElementById('asset-select').value;
    const expirySeconds = parseInt(document.getElementById('trade-expiry').value);
    const entryPrice = priceBase;
    const endTimeMillis = Date.now() + expirySeconds * 1000;
    const endTimeFirestore = firebase.firestore.Timestamp.fromMillis(endTimeMillis);

    if (!currentUserId) { showToast("User not ready", "error"); return; }

    const userRef = db.collection("users").doc(currentUserId);
    const tradesCol = userRef.collection("trades");
    const newTradeRef = tradesCol.doc();

    try {
        await db.runTransaction(async (transaction) => {
            const userSnap = await transaction.get(userRef);
            const currentBalance = userSnap.data().balance;
            if (currentBalance < amount) throw new Error("Insufficient balance");
            const newBalance = currentBalance - amount;
            transaction.update(userRef, { balance: newBalance });
            transaction.set(newTradeRef, {
                asset,
                direction,
                amount,
                expirySeconds,
                entryPrice,
                startTime: firebase.firestore.FieldValue.serverTimestamp(),
                endTime: endTimeFirestore,
                status: 'pending',
                resolved: false,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        // Update local balance
        balance -= amount;
        updateBalanceDisplay();

        // Set active trade
        activeTrade = {
            id: newTradeRef.id,
            asset,
            direction,
            amount,
            expiry: expirySeconds,
            entryPrice,
            timeLeft: expirySeconds,
            endTime: endTimeMillis
        };
        const tradeEl = document.getElementById('active-trade');
        tradeEl.classList.remove('hidden');
        tradeEl.className = `mt-4 p-3 rounded-lg border animate-slide-up ${direction === 'up' ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-red-500/50 bg-red-500/10'}`;
        document.getElementById('active-trade-info').textContent = `${asset} ${direction.toUpperCase()} • $${amount}`;
        document.getElementById('active-trade-timer').textContent = `${expirySeconds}s`;

        if (tradeTimer) clearInterval(tradeTimer);
        tradeTimer = setInterval(() => {
            if (!activeTrade) return;
            activeTrade.timeLeft--;
            document.getElementById('active-trade-timer').textContent = `${activeTrade.timeLeft}s`;
            if (activeTrade.timeLeft <= 0) {
                clearInterval(tradeTimer);
                resolveActiveTradeFromTimer();
            }
        }, 1000);
        showToast(`Trade placed: ${asset} ${direction.toUpperCase()} $${amount}`, 'success');
    } catch (err) {
        console.error(err);
        showToast("Trade failed: " + err.message, "error");
    }
}

// ------ Original UI helpers ------
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('sidebar-open');
    overlay.classList.toggle('hidden');
}
function navigateTo(view) {
    currentView = view;
    toggleSidebar();
    if (view === 'dashboard' || view === 'trade') {
        document.getElementById('view-dashboard').classList.remove('hidden');
        document.getElementById('view-other').classList.add('hidden');
    } else {
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-other').classList.remove('hidden');
        renderOtherView(view);
    }
    buildSidebar();
}
function renderOtherView(view) {
    const container = document.getElementById('view-other');
    const viewMap = {
        'copy-trading': `<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center"><i data-lucide="copy" class="w-12 h-12 mx-auto text-emerald-400 mb-3"></i><h2 class="text-xl font-bold mb-2">Copy Trading</h2><p class="text-gray-400 text-sm">Follow top traders (Demo)</p></div>`,
        'markets': `<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><h2 class="text-lg font-bold mb-4">Markets</h2><div class="space-y-2">${['BTC/USD $43,250', 'ETH/USD $2,610', 'AAPL $178.50', 'TSLA $248.20'].map(m => `<div class="flex justify-between py-2 border-b border-gray-800"><span class="font-mono">${m.split(' ')[0]}</span><span class="font-mono text-emerald-400">${m.split(' ')[1]}</span></div>`).join('')}</div></div>`,
        'wallet': `<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center"><h2 class="text-xl font-bold mb-2">Wallet</h2><p class="text-3xl font-mono font-bold text-emerald-400 my-4">$${balance.toLocaleString()}</p></div>`,
        'history': `<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><h2 class="text-lg font-bold mb-4">Transaction History</h2><div id="full-history-list"></div></div>`
    };
    container.innerHTML = viewMap[view] || `<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center"><p class="text-gray-400">Section: ${view}</p></div>`;
    if (view === 'history') renderFullHistory();
    lucide.createIcons();
}
function buildSidebar() {
    const menuItems = [
        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
        { id: 'trade', icon: 'candlestick-chart', label: 'Trade' },
        { id: 'copy-trading', icon: 'copy', label: 'Copy Trading' },
        { id: 'markets', icon: 'bar-chart-2', label: 'Markets' },
        { id: 'wallet', icon: 'wallet', label: 'Wallet' },
        { id: 'history', icon: 'clock', label: 'Trade History' },
        { id: 'settings', icon: 'settings', label: 'Settings' }
    ];
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = menuItems.map(item => `<button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800 transition-colors ${currentView === item.id ? 'bg-gray-800 text-white' : ''}"><i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span></button>`).join('');
    lucide.createIcons();
}
function initChart() {
    chartData = Array.from({length: 40}, () => {
        const open = priceBase + (Math.random() - 0.5) * 200;
        const close = open + (Math.random() - 0.5) * 150;
        return { open, close, high: Math.max(open, close) + Math.random() * 50, low: Math.min(open, close) - Math.random() * 50 };
    });
    renderChart();
}
function renderChart() {
    const container = document.getElementById('candle-chart');
    const maxPrice = Math.max(...chartData.map(c => c.high));
    const minPrice = Math.min(...chartData.map(c => c.low));
    const range = maxPrice - minPrice || 1;
    container.innerHTML = chartData.map(c => {
        const isGreen = c.close >= c.open;
        const bodyTop = ((maxPrice - Math.max(c.open, c.close)) / range) * 100;
        const bodyHeight = Math.max(2, (Math.abs(c.close - c.open) / range) * 100);
        return `<div class="flex-1 flex flex-col items-center justify-end h-full relative"><div class="candle-bar ${isGreen ? 'bg-emerald-500' : 'bg-red-500'}" style="height:${bodyHeight}%; margin-top:${bodyTop}%; min-height:3px;"></div></div>`;
    }).join('');
}
function updateChart() {
    const last = chartData[chartData.length - 1];
    const newClose = last.close + (Math.random() - 0.48) * 80;
    chartData.shift();
    chartData.push({ open: last.close, close: newClose, high: Math.max(last.close, newClose) + Math.random() * 30, low: Math.min(last.close, newClose) - Math.random() * 30 });
    priceBase = newClose;
    renderChart();
    updatePriceDisplay();
}
function updatePriceDisplay() {
    const asset = document.getElementById('asset-select').value;
    const priceMap = { 'BTC/USD': priceBase, 'ETH/USD': 2610 + (Math.random()-0.5)*20, 'AAPL': 178.5+(Math.random()-0.5)*2, 'TSLA': 248.2+(Math.random()-0.5)*3 };
    const price = priceMap[asset] || priceBase;
    const fmt = price.toFixed(asset.includes('USD') && !asset.startsWith('BTC') && !asset.startsWith('ETH') ? 4 : 2);
    document.getElementById('current-price').textContent = asset.includes('/') && !asset.startsWith('BTC') && !asset.startsWith('ETH') ? fmt : `$${fmt}`;
    const change = ((Math.random() - 0.45) * 2).toFixed(2);
    const changeEl = document.getElementById('price-change');
    changeEl.textContent = `${change > 0 ? '+' : ''}${change}%`;
    changeEl.className = `text-xs px-1.5 py-0.5 rounded ${change > 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`;
}
function changeAsset() {
    const assetPrices = { 'BTC/USD': 43250, 'ETH/USD': 2610, 'AAPL': 178.5, 'TSLA': 248.2 };
    priceBase = assetPrices[document.getElementById('asset-select').value] || 43250;
    initChart();
}
function toggleTheme() { showToast('Theme toggle — demo only', 'info'); }

// Bootstrap everything
(async () => {
    await initFirebaseUser();
    buildSidebar();
    initChart();
    setInterval(updateChart, 2000);
    lucide.createIcons();
    // elementSdk theme stub (keep existing)
    if (window.elementSdk && window.elementSdk.init) window.elementSdk.init({ defaultConfig: {} });
})();
</script>
