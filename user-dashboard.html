<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marketplace | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0/dist/umd/sdk.min.js"></script>
    <style>body { background: #0b1120; } .chat-sidebar { height: calc(100vh - 200px); overflow-y: auto; }</style>
</head>
<body class="text-white">
    <!-- Main navigation -->
    <nav class="bg-gray-900 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">AI Marketplace</h1>
        <div class="space-x-4">
            <button onclick="showSection('profile')" class="hover:text-indigo-400">Profile</button>
            <button onclick="showSection('projects')" class="hover:text-indigo-400">Projects/Jobs</button>
            <button onclick="showSection('certificates')" class="hover:text-indigo-400">Certificates</button>
            <button onclick="showSection('wallet')" class="hover:text-indigo-400">Wallet</button>
            <button onclick="showSection('chat')" class="hover:text-indigo-400">Chat</button>
            <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div id="profile" class="section">
            <h2 class="text-2xl font-bold mb-4">My Profile</h2>
            <div class="bg-gray-800 p-6 rounded-xl">
                <div class="mb-4">
                    <label class="block mb-2">Profile Picture (required for chat)</label>
                    <input type="file" id="profilePic" accept="image/*" class="bg-gray-700 p-2 rounded">
                    <button onclick="uploadProfilePic()" class="mt-2 bg-indigo-600 px-4 py-1 rounded">Upload</button>
                    <img id="profilePreview" class="mt-2 w-24 h-24 rounded-full object-cover hidden">
                </div>
                <div class="mb-4">
                    <label class="block mb-2">Skills (select or add custom)</label>
                    <div id="skillsContainer" class="flex flex-wrap gap-2 mb-2"></div>
                    <input type="text" id="newSkill" placeholder="New skill" class="bg-gray-700 p-2 rounded w-48">
                    <button onclick="addSkill()" class="bg-green-600 px-3 py-1 rounded">Add</button>
                </div>
                <button onclick="updateProfile()" class="bg-indigo-600 px-6 py-2 rounded">Save Profile</button>
            </div>
        </div>

        <div id="projects" class="section hidden">
            <h2 class="text-2xl font-bold mb-4">Available Projects</h2>
            <div id="jobsList" class="grid md:grid-cols-2 gap-4"></div>
            <h2 class="text-2xl font-bold mt-8 mb-4">My Active Projects</h2>
            <div id="myProjectsList" class="grid md:grid-cols-2 gap-4"></div>
        </div>

        <div id="certificates" class="section hidden">
            <h2 class="text-2xl font-bold mb-4">Certificates</h2>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-gray-800 p-4 rounded-xl">
                    <h3 class="text-xl font-semibold mb-2">My Certificates</h3>
                    <div id="myCerts"></div>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl">
                    <h3 class="text-xl font-semibold mb-2">Available Certificates (from Admin)</h3>
                    <div id="availableCerts"></div>
                </div>
            </div>
        </div>

        <div id="wallet" class="section hidden">
            <h2 class="text-2xl font-bold mb-4">Wallet & Payments</h2>
            <div class="bg-gray-800 p-6 rounded-xl">
                <p>Balance: $<span id="walletBalance">0</span> USD / <span id="walletBalanceKES">0</span> KES</p>
                <div class="mt-4 flex gap-4">
                    <input type="number" id="addAmount" placeholder="Amount (KES)" class="bg-gray-700 p-2 rounded">
                    <input type="text" id="mpesaPhone" placeholder="M-Pesa Phone" class="bg-gray-700 p-2 rounded">
                    <button onclick="addFundsMpesa()" class="bg-green-600 px-4 py-2 rounded">Add via M-Pesa</button>
                </div>
                <p class="text-sm text-gray-400 mt-2">*M-Pesa integration uses Lipana.dev (mock in demo).</p>
            </div>
        </div>

        <div id="chat" class="section hidden">
            <h2 class="text-2xl font-bold mb-4">Chat</h2>
            <div class="flex gap-4">
                <div class="w-1/3 bg-gray-800 p-4 rounded-xl">
                    <h3>Users</h3>
                    <div id="usersList" class="chat-sidebar space-y-2 mt-2"></div>
                </div>
                <div class="w-2/3 bg-gray-800 p-4 rounded-xl">
                    <div id="chatMessages" class="h-96 overflow-y-auto mb-4"></div>
                    <div class="flex gap-2">
                        <input type="text" id="chatInput" class="flex-1 bg-gray-700 p-2 rounded" placeholder="Type message...">
                        <button onclick="sendMessage()" class="bg-indigo-600 px-4 rounded">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- Appwrite init ----------
        const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
        const PROJECT_ID = '6a01720e0005a5f59bb9';
        const DATABASE_ID = '6a01723d0014a5c79b6f';
        const USERS_COLLECTION = 'users';
        const JOBS_COLLECTION = 'jobs';
        const PROJECTS_COLLECTION = 'projects';
        const CERTIFICATES_COLLECTION = 'certificates';
        const CERT_APPLICATIONS = 'cert_applications';
        const CHATS_COLLECTION = 'chats';
        const MESSAGES_COLLECTION = 'messages';
        const WALLET_COLLECTION = 'wallet'; // optional, we'll use user.walletBalance

        const { Client, Account, Databases, ID, Query, Storage } = Appwrite;
        const client = new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
        const account = new Account(client);
        const databases = new Databases(client);
        const storage = new Storage(client);

        let currentUser = null;
        let currentUserDoc = null;
        let activeChatId = null;
        let realtimeSubscription = null;

        // Load user data
        async function loadUser() {
            try {
                const user = await account.get();
                const docs = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION, [Query.equal('userId', user.$id)]);
                if (docs.total === 0) throw new Error('No user doc');
                currentUser = user;
                currentUserDoc = docs.documents[0];
                document.getElementById('walletBalance').innerText = currentUserDoc.walletBalance;
                document.getElementById('walletBalanceKES').innerText = (currentUserDoc.walletBalance * 130).toFixed(0);
                renderSkills();
                if (currentUserDoc.profilePictureId) {
                    const url = storage.getFilePreview('profile_bucket', currentUserDoc.profilePictureId);
                    document.getElementById('profilePreview').src = url;
                    document.getElementById('profilePreview').classList.remove('hidden');
                }
                loadJobs();
                loadMyProjects();
                loadMyCertificates();
                loadAvailableCertificates();
                loadAllUsers();
            } catch(e) { console.error(e); alert('Session expired, please login again'); window.location.href='index.html'; }
        }

        // Profile picture upload
        async function uploadProfilePic() {
            const file = document.getElementById('profilePic').files[0];
            if (!file) return;
            const res = await storage.createFile('profile_bucket', ID.unique(), file);
            await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, currentUserDoc.$id, { profilePictureId: res.$id });
            alert('Profile picture updated!');
            loadUser();
        }

        // Skills
        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = '';
            (currentUserDoc.skills || []).forEach(skill => {
                const badge = document.createElement('span');
                badge.className = 'bg-indigo-600 px-3 py-1 rounded-full text-sm';
                badge.innerText = skill;
                container.appendChild(badge);
            });
        }
        async function addSkill() {
            const newSkill = document.getElementById('newSkill').value.trim();
            if (!newSkill) return;
            const skills = [...(currentUserDoc.skills || []), newSkill];
            await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, currentUserDoc.$id, { skills });
            currentUserDoc.skills = skills;
            renderSkills();
            document.getElementById('newSkill').value = '';
        }
        async function updateProfile() { alert('Profile saved!'); loadUser(); }

        // Projects (Jobs)
        async function loadJobs() {
            const jobs = await databases.listDocuments(DATABASE_ID, JOBS_COLLECTION, [Query.equal('status', 'open')]);
            const container = document.getElementById('jobsList');
            container.innerHTML = '';
            for (const job of jobs.documents) {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 p-4 rounded-xl';
                card.innerHTML = `
                    <h3 class="text-xl font-semibold">${job.title}</h3>
                    <p>${job.description}</p>
                    <p class="text-indigo-300">Budget: $${job.budget}</p>
                    <p>Skills: ${job.skillsRequired?.join(', ')}</p>
                    <p>Certificate required: ${job.certificateTypeRequired || 'None'}</p>
                    <button onclick="applyForJob('${job.$id}')" class="mt-2 bg-indigo-600 px-4 py-1 rounded">Apply</button>
                `;
                container.appendChild(card);
            }
        }
        async function applyForJob(jobId) {
            // Step 1: check profile picture
            if (!currentUserDoc.profilePictureId) { alert('Please upload a profile picture first.'); showSection('profile'); return; }
            const job = (await databases.getDocument(DATABASE_ID, JOBS_COLLECTION, jobId));
            // Step 2: check skills match
            const missing = job.skillsRequired.filter(s => !currentUserDoc.skills.includes(s));
            if (missing.length) { alert(`Missing skills: ${missing.join(', ')}`); return; }
            // Step 3: check certificate if required
            if (job.certificateTypeRequired) {
                const myCerts = await databases.listDocuments(DATABASE_ID, CERT_APPLICATIONS, [Query.equal('userId', currentUser.$id), Query.equal('status', 'approved')]);
                const hasCert = myCerts.documents.some(c => c.certificateType === job.certificateTypeRequired);
                if (!hasCert) {
                    if (confirm('You need the required certificate. Go to Certificates section to purchase?')) showSection('certificates');
                    return;
                }
            }
            // Assign project
            const deadline = new Date();
            deadline.setDate(deadline.getDate() + (job.deadlineDays || 7));
            await databases.createDocument(DATABASE_ID, PROJECTS_COLLECTION, ID.unique(), {
                jobId: job.$id,
                freelancerId: currentUser.$id,
                status: 'active',
                deadline: deadline.toISOString(),
                amountAwarded: job.budget,
                submittedWork: null
            });
            alert('Project assigned! Check "My Active Projects".');
            loadMyProjects();
        }
        async function loadMyProjects() {
            const projects = await databases.listDocuments(DATABASE_ID, PROJECTS_COLLECTION, [Query.equal('freelancerId', currentUser.$id)]);
            const container = document.getElementById('myProjectsList');
            container.innerHTML = '';
            for (const proj of projects.documents) {
                const job = await databases.getDocument(DATABASE_ID, JOBS_COLLECTION, proj.jobId);
                const deadline = new Date(proj.deadline);
                const remaining = Math.max(0, Math.ceil((deadline - new Date()) / (1000*60*60*24)));
                container.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl">
                        <h3 class="font-bold">${job.title}</h3>
                        <p>Status: ${proj.status}</p>
                        <p>Deadline: ${remaining} days left</p>
                        ${proj.status === 'active' ? `<button onclick="submitWork('${proj.$id}')" class="bg-green-600 px-3 py-1 rounded mt-2">Submit Work</button>` : ''}
                        ${proj.status === 'pending_review' ? '<span class="text-yellow-400">Pending review</span>' : ''}
                        ${proj.status === 'completed' ? '<span class="text-green-400">Completed + funds added</span>' : ''}
                    </div>
                `;
            }
        }
        window.submitWork = async (projectId) => {
            const link = prompt('Submit file URL or paste work link:');
            if (link) {
                await databases.updateDocument(DATABASE_ID, PROJECTS_COLLECTION, projectId, { submittedWork: link, status: 'pending_review' });
                alert('Submitted for review');
                loadMyProjects();
            }
        };

        // Certificates
        async function loadMyCertificates() {
            const apps = await databases.listDocuments(DATABASE_ID, CERT_APPLICATIONS, [Query.equal('userId', currentUser.$id)]);
            const container = document.getElementById('myCerts');
            container.innerHTML = '';
            for (const app of apps.documents) {
                const cert = await databases.getDocument(DATABASE_ID, CERTIFICATES_COLLECTION, app.certificateId);
                container.innerHTML += `
                    <div class="border border-gray-700 p-3 rounded mb-2">
                        <p><strong>${cert.title}</strong> - Status: ${app.status}</p>
                        ${app.status === 'approved' ? `<p>Cert No: ${app.certificateNumber} | Expires: ${new Date(app.expiryDate).toLocaleDateString()}</p>
                        <a href="${app.downloadUrl}" target="_blank" class="text-indigo-400">Download Certificate</a>` : ''}
                    </div>
                `;
            }
        }
        async function loadAvailableCertificates() {
            const certs = await databases.listDocuments(DATABASE_ID, CERTIFICATES_COLLECTION, [Query.equal('isActive', true)]);
            const container = document.getElementById('availableCerts');
            container.innerHTML = '';
            for (const cert of certs.documents) {
                container.innerHTML += `
                    <div class="border border-gray-700 p-3 rounded mb-2">
                        <p><strong>${cert.title}</strong> - Validity: ${cert.validityMonths} months | Cost: $${cert.cost}</p>
                        <button onclick="applyForCertificate('${cert.$id}')" class="bg-indigo-600 px-3 py-1 rounded text-sm">Apply</button>
                    </div>
                `;
            }
        }
        window.applyForCertificate = async (certId) => {
            const cert = await databases.getDocument(DATABASE_ID, CERTIFICATES_COLLECTION, certId);
            if (currentUserDoc.walletBalance < cert.cost) {
                alert('Insufficient balance. Please add funds.');
                showSection('wallet');
                return;
            }
            // Deduct balance
            const newBalance = currentUserDoc.walletBalance - cert.cost;
            await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, currentUserDoc.$id, { walletBalance: newBalance });
            await databases.createDocument(DATABASE_ID, CERT_APPLICATIONS, ID.unique(), {
                userId: currentUser.$id,
                certificateId: certId,
                status: 'pending',
                appliedAt: new Date().toISOString(),
                userDetails: { name: currentUserDoc.name, email: currentUserDoc.email }
            });
            alert('Application submitted! Pending admin approval.');
            loadUser(); loadMyCertificates();
        };

        // Wallet & M-Pesa (mock integration)
        window.addFundsMpesa = async () => {
            const amountKES = parseInt(document.getElementById('addAmount').value);
            const phone = document.getElementById('mpesaPhone').value;
            if (!amountKES || !phone) { alert('Enter amount and phone'); return; }
            // Call Lipana.dev API (replace with live key)
            const response = await fetch('https://lipana.dev/api/mpesa/stkpush', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer YOUR_LIPANA_API_KEY' },
                body: JSON.stringify({ amount: amountKES, phone, shortcode: '174379' })
            });
            const data = await response.json();
            if (data.success) {
                // In production, webhook updates wallet. For demo, add manually.
                const usdAmount = amountKES / 130;
                const newBalance = currentUserDoc.walletBalance + usdAmount;
                await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, currentUserDoc.$id, { walletBalance: newBalance });
                alert('Funds added!');
                loadUser();
            } else {
                alert('Payment failed');
            }
        };

        // Chat System
        async function loadAllUsers() {
            const users = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION);
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            for (const u of users.documents) {
                if (u.userId === currentUser.$id) continue;
                container.innerHTML += `
                    <div class="p-2 bg-gray-700 rounded cursor-pointer hover:bg-gray-600" onclick="startChat('${u.userId}', '${u.name}')">
                        <div class="flex items-center gap-2">
                            <img src="${u.profilePictureId ? await storage.getFilePreview('profile_bucket', u.profilePictureId) : 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover">
                            <span>${u.name}</span>
                        </div>
                    </div>
                `;
            }
        }
        window.startChat = async (targetUserId, targetName) => {
            // Check if current user has profile pic
            if (!currentUserDoc.profilePictureId) { alert('You must upload a profile picture to chat.'); showSection('profile'); return; }
            // Find or create chat room
            let chatId = null;
            const existing = await databases.listDocuments(DATABASE_ID, CHATS_COLLECTION, [
                Query.contains('participants', [currentUser.$id, targetUserId])
            ]);
            if (existing.total > 0) chatId = existing.documents[0].$id;
            else {
                const newChat = await databases.createDocument(DATABASE_ID, CHATS_COLLECTION, ID.unique(), {
                    participants: [currentUser.$id, targetUserId],
                    lastMessage: '',
                    updatedAt: new Date()
                });
                chatId = newChat.$id;
            }
            activeChatId = chatId;
            if (realtimeSubscription) realtimeSubscription();
            // Load messages
            const messages = await databases.listDocuments(DATABASE_ID, MESSAGES_COLLECTION, [Query.equal('chatId', chatId), Query.orderAsc('createdAt')]);
            const msgDiv = document.getElementById('chatMessages');
            msgDiv.innerHTML = '';
            messages.documents.forEach(m => {
                const isMe = m.senderId === currentUser.$id;
                msgDiv.innerHTML += `<div class="${isMe ? 'text-right' : 'text-left'}"><span class="bg-gray-700 p-2 rounded inline-block">${m.text}</span></div>`;
            });
            // Subscribe realtime
            realtimeSubscription = client.subscribe(`databases.${DATABASE_ID}.collections.${MESSAGES_COLLECTION}.documents`, (event) => {
                if (event.payload.chatId === activeChatId) {
                    const isMe = event.payload.senderId === currentUser.$id;
                    msgDiv.innerHTML += `<div class="${isMe ? 'text-right' : 'text-left'}"><span class="bg-gray-700 p-2 rounded inline-block">${event.payload.text}</span></div>`;
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
            });
        };
        window.sendMessage = async () => {
            const text = document.getElementById('chatInput').value;
            if (!text || !activeChatId) return;
            await databases.createDocument(DATABASE_ID, MESSAGES_COLLECTION, ID.unique(), {
                chatId: activeChatId,
                senderId: currentUser.$id,
                text,
                createdAt: new Date().toISOString()
            });
            document.getElementById('chatInput').value = '';
        };

        // Section switching
        window.showSection = (id) => {
            document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'chat' && !activeChatId) loadAllUsers();
        };
        window.logout = async () => { await account.deleteSession('current'); window.location.href = 'index.html'; };

        loadUser();
    </script>
</body>
</html>
