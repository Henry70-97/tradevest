<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<style>
body{
background:#0f172a;
}
.sidebar{
width:260px;
}
</style>

</head>

<body class="text-white flex">

<!-- SIDEBAR -->

<div class="sidebar min-h-screen bg-slate-900 p-5">

<h1 class="text-3xl font-bold mb-10">
Nexus AI
</h1>

<div class="space-y-3">

<button onclick="showSection('dashboard')" class="w-full text-left p-3 bg-slate-800 rounded-xl">Dashboard</button>

<button onclick="showSection('jobs')" class="w-full text-left p-3 bg-slate-800 rounded-xl">Browse Jobs</button>

<button onclick="showSection('myjobs')" class="w-full text-left p-3 bg-slate-800 rounded-xl">My Jobs</button>

<button onclick="showSection('proposals')" class="w-full text-left p-3 bg-slate-800 rounded-xl">My Proposals</button>

<button onclick="showSection('wallet')" class="w-full text-left p-3 bg-slate-800 rounded-xl">Wallet</button>

<button onclick="showSection('messages')" class="w-full text-left p-3 bg-slate-800 rounded-xl">Messages</button>

<button onclick="showSection('settings')" class="w-full text-left p-3 bg-slate-800 rounded-xl">Settings</button>

<button onclick="logout()" class="w-full text-left p-3 bg-red-600 rounded-xl">Logout</button>

</div>

</div>

<!-- MAIN -->

<div class="flex-1 p-8">

<!-- DASHBOARD -->

<div id="dashboard" class="section">

<h2 class="text-4xl font-bold mb-6">
Dashboard
</h2>

<div class="grid grid-cols-3 gap-5">

<div class="bg-slate-800 p-6 rounded-2xl">
<h3 class="text-gray-400">Wallet</h3>
<p class="text-3xl font-bold">$0</p>
</div>

<div class="bg-slate-800 p-6 rounded-2xl">
<h3 class="text-gray-400">Active Jobs</h3>
<p class="text-3xl font-bold" id="activeJobs">0</p>
</div>

<div class="bg-slate-800 p-6 rounded-2xl">
<h3 class="text-gray-400">Proposals</h3>
<p class="text-3xl font-bold" id="proposalCount">0</p>
</div>

</div>

</div>

<!-- JOBS -->

<div id="jobs" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
Browse Jobs
</h2>

<div id="jobsContainer"></div>

</div>

<!-- MY JOBS -->

<div id="myjobs" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
Post Job
</h2>

<div class="bg-slate-800 p-6 rounded-2xl max-w-xl">

<input id="title"
placeholder="Job title"
class="w-full p-4 rounded-xl bg-slate-900 mb-4">

<textarea id="description"
placeholder="Description"
class="w-full p-4 rounded-xl bg-slate-900 mb-4"></textarea>

<input id="budget"
placeholder="Budget"
class="w-full p-4 rounded-xl bg-slate-900 mb-4">

<button onclick="createGig()"
class="bg-green-600 px-6 py-3 rounded-xl">
Post Job
</button>

</div>

</div>

<!-- PROPOSALS -->

<div id="proposals" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
My Proposals
</h2>

<div id="proposalContainer"></div>

</div>

<!-- WALLET -->

<div id="wallet" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
Wallet
</h2>

<div class="bg-slate-800 p-8 rounded-2xl">
Balance: $0
</div>

</div>

<!-- MESSAGES -->

<div id="messages" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
Messages
</h2>

<div class="bg-slate-800 p-8 rounded-2xl">
No messages yet
</div>

</div>

<!-- SETTINGS -->

<div id="settings" class="section hidden">

<h2 class="text-4xl font-bold mb-6">
Settings
</h2>

<div class="bg-slate-800 p-8 rounded-2xl">
Profile settings coming soon
</div>

</div>

</div>

<script>

const client = new Appwrite.Client()
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6a01720e0005a5f59bb9");

const account = new Appwrite.Account(client);
const databases = new Appwrite.Databases(client);

const DATABASE_ID = "6a01723d0014a5c79b6f";

const GIGS = "gigs";
const PROPOSALS = "proposals";

function showSection(id){

document.querySelectorAll(".section").forEach(sec=>{
sec.classList.add("hidden");
});

document.getElementById(id).classList.remove("hidden");

}

async function createGig(){

const user = await account.get();

await databases.createDocument(
DATABASE_ID,
GIGS,
Appwrite.ID.unique(),
{
title:title.value,
description:description.value,
budget:Number(budget.value),
clientId:user.$id,
status:"open"
}
);

alert("Job posted");

loadJobs();

}

async function loadJobs(){

const res = await databases.listDocuments(
DATABASE_ID,
GIGS
);

document.getElementById("jobsContainer").innerHTML =
res.documents.map(job=>`

<div class="bg-slate-800 p-6 rounded-2xl mb-4">

<h3 class="text-2xl font-bold">
${job.title}
</h3>

<p class="text-gray-400 mt-2">
${job.description}
</p>

<p class="mt-4">
Budget: $${job.budget}
</p>

<button onclick="apply('${job.$id}')"
class="mt-4 bg-blue-600 px-5 py-2 rounded-xl">
Apply
</button>

</div>

`).join("");

document.getElementById("activeJobs").innerText =
res.documents.length;

}

async function apply(gigId){

const user = await account.get();

const coverLetter = prompt("Cover Letter");
const price = prompt("Your Price");

await databases.createDocument(
DATABASE_ID,
PROPOSALS,
Appwrite.ID.unique(),
{
gigId,
freelancerId:user.$id,
coverLetter,
price:Number(price),
status:"pending"
}
);

alert("Applied");

loadProposals();

}

async function loadProposals(){

const user = await account.get();

const res = await databases.listDocuments(
DATABASE_ID,
PROPOSALS,
[
Appwrite.Query.equal("freelancerId",user.$id)
]
);

document.getElementById("proposalContainer").innerHTML =
res.documents.map(p=>`

<div class="bg-slate-800 p-6 rounded-2xl mb-4">

<p>
Proposal Price: $${p.price}
</p>

<p class="mt-2">
Status: ${p.status}
</p>

</div>

`).join("");

document.getElementById("proposalCount").innerText =
res.documents.length;

}

async function logout(){
await account.deleteSessions();
window.location.href = "index.html";
}

loadJobs();
loadProposals();

</script>

</body>
</html>
