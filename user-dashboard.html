<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus AI | Freelancer Marketplace</title>
    <!-- Tailwind + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0/dist/umd/sdk.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .futuristic { font-family: 'Space Grotesk', monospace; letter-spacing: -0.02em; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { transition: transform 0.3s ease; }
        .bottom-nav a.active { color: #4f46e5; background: rgba(79,70,229,0.2); }
        .chat-bubble { max-width: 75%; word-break: break-word; }
        .notification-badge { position: absolute; top: -5px; right: -8px; background: #ef4444; border-radius: 9999px; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200">
    <!-- Mobile Hamburger Menu -->
    <div class="fixed top-4 left-4 z-50 md:hidden">
        <button id="menuToggle" class="text-white text-2xl">☰</button>
    </div>
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gray-900 border-r border-gray-800 transform -translate-x-full transition-transform z-40 md:translate-x-0 md:relative">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-indigo-400">Nexus AI</h2>
            <nav class="mt-8 space-y-3">
                <a href="#" data-page="dashboard" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">📊 Dashboard</a>
                <a href="#" data-page="marketplace" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">🛒 Marketplace</a>
                <a href="#" data-page="projects" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">📁 My Projects</a>
                <a href="#" data-page="chat" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">💬 Chat</a>
                <a href="#" data-page="certificates" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">🎓 Certificates</a>
                <a href="#" data-page="school" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">🏫 Nexus AI School</a>
                <a href="#" data-page="referrals" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">🤝 Referrals</a>
                <a href="#" data-page="wallet" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">💰 Wallet</a>
                <a href="#" data-page="profile" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">👤 Profile & KYC</a>
                <a href="#" data-page="notifications" class="nav-link block py-2 px-3 rounded-lg hover:bg-gray-800">🔔 Notifications</a>
                <a href="#" class="block py-2 px-3 rounded-lg hover:bg-gray-800" onclick="logout()">🚪 Logout</a>
            </nav>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="md:ml-64 p-4 pb-20 md:pb-4">
        <div id="pageContent" class="max-w-7xl mx-auto">
            <!-- Dynamic pages will load here -->
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 flex justify-around py-2 md:hidden z-30">
        <a href="#" data-page="dashboard" class="bottom-nav-link text-gray-400 p-2">🏠</a>
        <a href="#" data-page="marketplace" class="bottom-nav-link text-gray-400 p-2">🛒</a>
        <a href="#" data-page="chat" class="bottom-nav-link text-gray-400 p-2">💬</a>
        <a href="#" data-page="projects" class="bottom-nav-link text-gray-400 p-2">📁</a>
        <a href="#" data-page="profile" class="bottom-nav-link text-gray-400 p-2">👤</a>
    </div>

    <script>
        // ---------- Appwrite Config ----------
        const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
        const PROJECT_ID = '6a01720e0005a5f59bb9';
        const DATABASE_ID = '6a01723d0014a5c79b6f';
        const USERS_COLLECTION = 'users';
        const FOLLOWS_COLLECTION = 'follows';
        const CHATS_COLLECTION = 'chats';
        const MESSAGES_COLLECTION = 'messages';
        const NOTIFICATIONS_COLLECTION = 'notifications';
        const COURSES_COLLECTION = 'courses';
        const ENROLLMENTS_COLLECTION = 'enrollments';
        const PROJECTS_COLLECTION = 'projects';
        const WALLET_TX = 'transactions';

        const { Client, Account, Databases, ID, Query, Storage } = Appwrite;
        const client = new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
        const account = new Account(client);
        const databases = new Databases(client);
        const storage = new Storage(client);

        let currentUser = null;
        let currentUserDoc = null;

        // Helper: load user data
        async function loadUser() {
            try {
                const user = await account.get();
                const docs = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION, [Query.equal('userId', user.$id)]);
                if (docs.total === 0) throw new Error('User doc missing');
                currentUser = user;
                currentUserDoc = docs.documents[0];
                renderPage('dashboard');
            } catch(e) { window.location.href = 'index.html'; }
        }

        // Page rendering (simplified but extensible)
        async function renderPage(page) {
            const container = document.getElementById('pageContent');
            if (page === 'dashboard') container.innerHTML = await renderDashboard();
            else if (page === 'marketplace') container.innerHTML = await renderMarketplace();
            else if (page === 'projects') container.innerHTML = await renderProjects();
            else if (page === 'chat') container.innerHTML = await renderChat();
            else if (page === 'certificates') container.innerHTML = await renderCertificates();
            else if (page === 'school') container.innerHTML = await renderSchool();
            else if (page === 'referrals') container.innerHTML = renderReferrals();
            else if (page === 'wallet') container.innerHTML = await renderWallet();
            else if (page === 'profile') container.innerHTML = await renderProfile();
            else if (page === 'notifications') container.innerHTML = await renderNotifications();
            attachPageScripts(page);
        }

        // Dashboard (stats, recent activity)
        async function renderDashboard() { return `<div class="glass-card p-6 rounded-2xl"><h2 class="text-3xl font-bold">Dashboard</h2><p>Welcome, ${currentUserDoc.name}</p><div class="grid md:grid-cols-4 gap-4 mt-6"><div class="bg-gray-800 p-4 rounded">Active Projects: 3</div><div class="bg-gray-800 p-4 rounded">Pending Orders: 2</div><div class="bg-gray-800 p-4 rounded">Wallet: $${currentUserDoc.walletBalance}</div><div class="bg-gray-800 p-4 rounded">Followers: ${currentUserDoc.followersCount || 0}</div></div></div>`; }

        // Marketplace: browse freelancers with follow button
        async function renderMarketplace() {
            const freelancers = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION, [Query.equal('role', 'freelancer')]);
            let html = `<h2 class="text-2xl font-bold mb-4">Discover Talent</h2><div class="grid md:grid-cols-3 gap-4">`;
            for (const f of freelancers.documents) {
                const isFollowing = await checkIfFollowing(f.userId);
                html += `<div class="glass-card p-4 rounded-xl"><img class="w-16 h-16 rounded-full" src="${f.profilePictureId ? await storage.getFilePreview('profile_bucket', f.profilePictureId) : 'https://via.placeholder.com/64'}"><h3>${f.name}</h3><p>⭐ ${f.rating || 4.5} · 👥 ${f.followersCount || 0}</p><button onclick="followUser('${f.userId}')" class="mt-2 bg-indigo-600 px-4 py-1 rounded">${isFollowing ? 'Following' : 'Follow'}</button></div>`;
            }
            html += `</div><div class="mt-8"><h3 class="text-xl">Trending Gigs</h3><div class="grid md:grid-cols-2 gap-4 mt-2" id="trendingGigs"></div></div>`;
            return html;
        }

        async function checkIfFollowing(freelancerId) { const res = await databases.listDocuments(DATABASE_ID, FOLLOWS_COLLECTION, [Query.equal('followerId', currentUser.$id), Query.equal('followedId', freelancerId)]); return res.total > 0; }
        window.followUser = async (followedId) => { await databases.createDocument(DATABASE_ID, FOLLOWS_COLLECTION, ID.unique(), { followerId: currentUser.$id, followedId, createdAt: new Date() }); alert('Followed!'); renderPage('marketplace'); };

        // Chat: inbox (friends) and requests (non-followers)
        async function renderChat() {
            // Get all chats where user is participant
            const chats = await databases.listDocuments(DATABASE_ID, CHATS_COLLECTION, [Query.contains('participants', [currentUser.$id])]);
            let inboxHtml = '', requestsHtml = '';
            for (const chat of chats.documents) {
                const otherId = chat.participants.find(p => p !== currentUser.$id);
                const otherUser = (await databases.listDocuments(DATABASE_ID, USERS_COLLECTION, [Query.equal('userId', otherId)])).documents[0];
                const isFollowing = await checkIfFollowing(otherId);
                const lastMsg = chat.lastMessage || 'Click to chat';
                const chatItem = `<div class="p-3 bg-gray-800 rounded-lg cursor-pointer" onclick="openChat('${chat.$id}', '${otherUser.name}')"><div class="flex justify-between"><span>${otherUser.name}</span><span class="text-xs text-gray-400">${new Date(chat.updatedAt).toLocaleTimeString()}</span></div><p class="text-sm truncate">${lastMsg}</p></div>`;
                if (isFollowing) inboxHtml += chatItem;
                else requestsHtml += chatItem;
            }
            return `<h2 class="text-2xl font-bold">Chat</h2><div class="grid md:grid-cols-2 gap-6 mt-4"><div><h3 class="text-xl">📥 Inbox (Friends)</h3><div class="space-y-2">${inboxHtml || '<p class="text-gray-500">No chats with friends</p>'}</div></div><div><h3 class="text-xl">⚠️ Requests</h3><div class="space-y-2">${requestsHtml || '<p class="text-gray-500">No message requests</p>'}</div></div></div><div id="chatWindow" class="mt-6 hidden glass-card p-4 rounded-xl"><div id="chatMessages" class="h-80 overflow-y-auto mb-4"></div><div class="flex gap-2"><input type="text" id="msgInput" class="flex-1 bg-gray-800 p-2 rounded" placeholder="Type..."><button onclick="sendMessage()" class="bg-indigo-600 px-4 rounded">Send</button><input type="file" id="fileInput" class="hidden"><button onclick="document.getElementById('fileInput').click()" class="bg-gray-600 px-3 rounded">📎</button></div></div>`;
        }

        window.openChat = async (chatId, name) => { document.getElementById('chatWindow').classList.remove('hidden'); /* load messages realtime */ };
        window.sendMessage = async () => { /* implement with file upload */ alert('Message sent (demo)'); };

        // Referrals: share link, track earnings
        function renderReferrals() {
            return `<div class="glass-card p-6 rounded-2xl"><h2 class="text-2xl font-bold">Refer & Earn</h2><p>Share your link: <span class="bg-gray-800 p-2 rounded">${window.location.origin}/ref/${currentUser.$id}</span></p><p>Earn $20 per referral (cannot withdraw unless you have 5 certificates).</p><p>Your referral balance: $${currentUserDoc.referralBalance || 0}</p></div>`;
        }

        // Nexus AI School: courses, enrollment, payment
        async function renderSchool() {
            const courses = await databases.listDocuments(DATABASE_ID, COURSES_COLLECTION);
            let html = `<h2 class="text-2xl font-bold">Nexus AI School</h2><div class="grid md:grid-cols-3 gap-4">`;
            for (const c of courses.documents) {
                html += `<div class="glass-card p-4 rounded-xl"><h3>${c.title}</h3><p>${c.description}</p><p class="text-indigo-400">$${c.cost}</p><button onclick="enrollCourse('${c.$id}', ${c.cost})" class="bg-green-600 px-4 py-1 rounded mt-2">Enroll</button></div>`;
            }
            return html + `</div>`;
        }

        window.enrollCourse = async (courseId, cost) => {
            if (currentUserDoc.walletBalance < cost) { alert('Insufficient balance'); return; }
            // Deduct wallet (in real app, create transaction)
            await databases.updateDocument(DATABASE_ID, USERS_COLLECTION, currentUserDoc.$id, { walletBalance: currentUserDoc.walletBalance - cost });
            await databases.createDocument(DATABASE_ID, ENROLLMENTS_COLLECTION, ID.unique(), { userId: currentUser.$id, courseId, status: 'pending', amountPaid: cost });
            alert('Enrollment submitted! After approval, certificate will be issued.');
        };

        // Profile & KYC (document upload)
        async function renderProfile() {
            return `<div class="glass-card p-6 rounded-2xl"><h2>My Profile</h2><input type="file" id="kycDoc" accept="image/*"><input type="file" id="kycPortrait"><button onclick="submitKYC()" class="bg-indigo-600 px-4 py-2 rounded mt-2">Submit KYC</button><p>KYC Status: ${currentUserDoc.kycStatus || 'pending'}</p></div>`;
        }
        window.submitKYC = async () => { alert('KYC submitted for admin review'); };

        // Notifications (real admin announcements)
        async function renderNotifications() {
            const notifs = await databases.listDocuments(DATABASE_ID, NOTIFICATIONS_COLLECTION, [Query.equal('userId', currentUser.$id)]);
            let html = `<h2>Notifications</h2>`;
            notifs.documents.forEach(n => { html += `<div class="glass-card p-3 my-2">${n.message}</div>`; });
            return html;
        }

        // Wallet, projects, certificates similar patterns
        async function renderWallet() { return `<div class="glass-card p-6">Balance: $${currentUserDoc.walletBalance}</div>`; }
        async function renderProjects() { return `<div class="glass-card p-6">Active projects listed here</div>`; }
        async function renderCertificates() { return `<div class="glass-card p-6">Your certificates will appear</div>`; }

        // Helper to attach dynamic events
        function attachPageScripts(page) { /* bind any buttons */ }

        // Navigation
        window.renderPage = renderPage;
        window.logout = async () => { await account.deleteSession('current'); window.location.href = 'index.html'; };

        // Sidebar toggle
        document.getElementById('menuToggle')?.addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); });
        document.querySelectorAll('.nav-link, .bottom-nav-link').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); renderPage(link.dataset.page); if(window.innerWidth<768) document.getElementById('sidebar').classList.add('-translate-x-full'); }); });

        loadUser();
    </script>
</body>
</html>
